    <script>
      // Ignore expected Vite HMR WebSocket connection errors in environments where HMR is disabled
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) ? String(event.message) : '';
        var file = (event && event.filename) ? String(event.filename) : '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          file.includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopPropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var reason = (event && event.reason) ? String(event.reason) : '';
        if (
          reason.includes('WebSocket') ||
          reason.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
          event.stopPropagation();
        }
      }, true);
    </script>
